# MkDocs Configuration for Data Ingestor
# Documentation: https://www.mkdocs.org/user-guide/configuration/

site_name: Data Ingestor
site_description: Production-grade RAG data ingestion pipeline for intelligent document processing
site_author: Byron Williams
site_url: https://williaby.github.io/data_ingestor
repo_url: https://github.com/williaby/data_ingestor
repo_name: williaby/data_ingestor
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Byron Williams

# Theme Configuration
theme:
  name: material
  language: en

  # Color Palette
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # Anchor tracking
    - navigation.tabs         # Top-level navigation tabs
    - navigation.sections     # Navigation sections
    - navigation.expand       # Expand sections by default
    - navigation.indexes      # Section index pages
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search results
    - content.code.copy       # Copy code button
    - content.code.annotate   # Code annotations
    - toc.follow              # Follow TOC sidebar

  # Fonts
  font:
    text: Roboto
    code: Roboto Mono

  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

  - autorefs  # Automatic cross-references

  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_if_no_docstring: false
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: alphabetical
            group_by_category: true
            show_category_heading: true
            filters:
              - "!^_"  # Hide private members
            extensions:
              - griffe_pydantic  # Render Pydantic constraints

  - section-index  # Section index pages

  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: date

# Markdown Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra Configuration
extra:
  org_name: "Byron Williams"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/williaby
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

# Navigation
nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md

  - User Guide:
      - Overview: guides/overview.md
      - Document Processing: guides/processing.md
      - Parser Selection: guides/parsers.md
      - Chunking Strategies: guides/chunking.md
      - Export Formats: guides/export.md
      - Benchmarking: guides/benchmarking.md

  - API Reference:
      - Overview: api-reference.md
      - Core Models: api/core.md
      - Parsers: api/parsers.md
      - Pipeline: api/pipeline.md
      - Chunking: api/chunking.md
      - Export: api/export.md
      - Evaluation: api/evaluation.md
      - Benchmarking: api/benchmarking.md

  - Architecture:
      - System Design: architecture/design.md
      - Parser Architecture: architecture/parsers.md
      - Pipeline Architecture: architecture/pipeline.md
      - Evaluation Framework: architecture/evaluation.md

  - Advanced:
      - Intelligent OCR System: advanced/intelligent-ocr.md
      - Docling Integration: advanced/docling-integration.md
      - Multimodal RAG: advanced/multimodal-rag.md
      - Performance Tuning: advanced/performance.md

  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Code Quality: development/code-quality.md
      - Project Structure: development/structure.md

  - Project:
      - Project Plan: PROJECT_PLAN.md
      - Roadmap: project/roadmap.md
      - Phase Status: COMPLETION_STATUS.md
      - Changelog: project/changelog.md
      - License: project/license.md

# Validation
# Strict mode disabled to allow links to repo root files (PROJECT_PLAN.md, CLAUDE.md, etc.)
# These files are valid but outside docs/ directory
strict: false
