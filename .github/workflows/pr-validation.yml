# PR Validation for Data Ingestor Document Processing System
# Ensures dependency consistency and project standards compliance

name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch full history for accurate diff analysis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync --frozen

      # Validate document processing dependencies
      - name: Validate Document Processing Dependencies
        run: |
          echo "📄 Validating document processing dependencies..."

          uv run --frozen python -c "
          import sys

          # Critical dependencies for document processing
          critical_deps = {
              'pdfplumber': 'PDF text extraction',
              'pypdf': 'PDF manipulation',
              'python_docx': 'Word document processing',
              'markdown': 'Markdown generation',
              'tiktoken': 'Token counting',
              'pydantic': 'Data validation'
          }

          # Optional but important dependencies
          optional_deps = {
              'docling': 'Advanced PDF parsing',
              'transformers': 'Vision models for OCR',
              'torch': 'Deep learning backend'
          }

          print('📄 Document Processing Dependency Validation:')
          failed_deps = []

          for dep_name, description in critical_deps.items():
              try:
                  module_name = dep_name.replace('-', '_')
                  imported_module = __import__(module_name)
                  version = getattr(imported_module, '__version__', 'unknown')
                  print(f'✅ {dep_name} ({version}): {description}')
              except ImportError as e:
                  print(f'❌ {dep_name}: MISSING - {description}')
                  failed_deps.append(dep_name)

          print('\\n🎯 Optional Dependencies:')
          for dep_name, description in optional_deps.items():
              try:
                  module_name = dep_name.replace('-', '_')
                  imported_module = __import__(module_name)
                  version = getattr(imported_module, '__version__', 'unknown')
                  print(f'✅ {dep_name} ({version}): {description}')
              except ImportError:
                  print(f'⚠️  {dep_name}: Not installed - {description} (optional)')

          if failed_deps:
              print(f'\\n🚨 Critical dependencies missing: {failed_deps}')
              sys.exit(1)
          else:
              print('\\n🎉 All critical document processing dependencies are available')
          "

      # Check for dependency changes and validate requirements sync
      - name: Check dependency changes
        id: deps-changed
        run: |

          # Check if uv.lock or pyproject.toml changed
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -E "(uv\.lock|pyproject\.toml)"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Dependency files have changed in this PR"

            # Show what changed
            echo "🔍 Changes detected:"
            git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -E "(uv\.lock|pyproject\.toml)" | while read file; do
              echo "  - $file"
            done
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No dependency changes detected"
          fi

      # Generate and validate requirements.txt if dependencies changed
      - name: Validate Requirements Sync
        if: steps.deps-changed.outputs.changed == 'true'
        run: |
          echo "🔄 Validating requirements.txt synchronization..."

          # Generate current requirements
          echo "Generating requirements.txt from uv.lock..."
          uv export --format requirements-txt --no-hashes --no-emit-project --no-default-groups --output requirements.txt

          echo "Generating requirements-dev.txt from uv.lock..."
          uv export --format requirements-txt --no-hashes --no-emit-project --output requirements-dev.txt

          # Check if generated files match committed files
          if ! git diff --exit-code requirements*.txt 2>/dev/null; then
            echo "::error::Requirements files are out of sync with uv.lock"
            echo "::error::This PR modifies dependencies but requirements.txt files don't match."
            echo ""
            echo "📋 Files needing update:"
            git diff --name-only requirements*.txt 2>/dev/null || echo "  - requirements.txt files need to be created/updated"
            echo ""
            echo "🔧 To fix this:"
            echo "1. Run: uv export --format requirements-txt --no-hashes --no-emit-project --no-default-groups --output requirements.txt"
            echo "2. Run: uv export --format requirements-txt --no-hashes --no-emit-project --output requirements-dev.txt"
            echo "3. Commit the updated requirements files"
            echo "4. Push changes to this PR"
            exit 1
          else
            echo "✅ Requirements files are synchronized with uv.lock"
          fi

      # Validate project structure for document processing
      - name: Validate Project Structure
        run: |
          echo "🏗️ Validating document processing project structure..."

          required_dirs=(
            "src"
            "src/data_ingestor"
            "src/data_ingestor/parsers"
            "src/data_ingestor/chunking"
            "src/data_ingestor/quality"
            "src/data_ingestor/export"
            "src/data_ingestor/core"
            "tests"
            "docs"
          )

          required_files=(
            "pyproject.toml"
            "README.md"
            "CLAUDE.md"
            ".env.example"
          )

          echo "📁 Checking required directories:"
          missing_dirs=0
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✅ $dir"
            else
              echo "  ❌ $dir (missing)"
              missing_dirs=$((missing_dirs + 1))
            fi
          done

          echo "📄 Checking required files:"
          missing_files=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ⚠️  $file (missing)"
              missing_files=$((missing_files + 1))
            fi
          done

          if [ $missing_dirs -gt 0 ]; then
            echo "::warning::Some required directories are missing"
          fi

          if [ $missing_files -gt 0 ]; then
            echo "::warning::Some recommended files are missing"
          fi

      # Security validation for document processing
      - name: Basic Security Validation
        run: |
          echo "🔒 Running basic security validation..."

          # Check for obvious security issues
          echo "🔍 Checking for potential security issues:"

          # Look for hardcoded secrets
          if find src -name "*.py" -exec grep -l "password.*=" {} + 2>/dev/null | head -5; then
            echo "⚠️  Potential hardcoded passwords found - please review"
          else
            echo "✅ No obvious hardcoded passwords detected"
          fi

          # Check for unsafe file operations
          if find src -name "*.py" -exec grep -l "open.*'w'" {} + 2>/dev/null | head -5; then
            echo "⚠️  File write operations found - ensure proper path validation"
          else
            echo "✅ No obvious unsafe file operations detected"
          fi

          # Validate environment template
          if [ -f ".env.example" ]; then
            echo "✅ Environment template exists"
            if grep -q "DATA_INGESTOR" .env.example; then
              echo "✅ Environment template contains expected document processing variables"
            else
              echo "⚠️  Environment template may be incomplete"
            fi
          else
            echo "⚠️  Missing .env.example file"
          fi

      # Code quality quick check
      - name: Quick Code Quality Check
        run: |
          echo "🧹 Running quick code quality checks..."

          # Check basic Python syntax
          echo "Checking Python syntax..."
          find src -name "*.py" -print0 | while IFS= read -r -d '' file; do
            uv run --frozen python -c "
import ast
import sys

try:
    with open('$file', 'r') as f:
        ast.parse(f.read())
    print('✅ $file: Valid syntax')
except SyntaxError as e:
    print('❌ $file: Syntax error - ' + str(e))
    sys.exit(1)
            " || exit 1
          done

          echo "✅ Basic code quality validation completed"

      # Skip validation if no changes
      - name: Skip Validation (No Changes)
        if: steps.deps-changed.outputs.changed == 'false'
        run: |
          echo "✅ No dependency changes - validation complete"
          echo "📝 This PR does not modify dependencies"
          echo "🚀 Standard CI pipeline will validate code changes"
