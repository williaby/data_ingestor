# OpenSSF Scorecard Security Assessment
# Automated security health metrics for open source projects
# Results published to: https://scorecard.dev/viewer/?uri=github.com/Byron/data_ingestor

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesday at 9:21 PM UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload SARIF results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to clone repository
      contents: read
      # Needed to access workflow runs
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          # Allow scorecard to make necessary API calls
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            api.scorecard.dev:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for accurate analysis

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results for public repositories
          publish_results: true
          # Optional: Use GitHub PAT for more accurate branch protection checks
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error
