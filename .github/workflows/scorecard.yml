# OpenSSF Scorecard Security Assessment
# Automated security health metrics for open source projects
# Results published to: https://scorecard.dev/viewer/?uri=github.com/Byron/data_ingestor

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesday at 9:21 PM UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload SARIF results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to clone repository
      contents: read
      # Needed to access workflow runs
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          # Allow scorecard to make necessary API calls
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            api.scorecard.dev:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for accurate analysis

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results for public repositories
          publish_results: true
          # Optional: Use GitHub PAT for more accurate branch protection checks
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: scorecard-results.sarif

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error
