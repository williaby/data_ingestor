# OpenSSF Scorecard Security Assessment
# Automated security health metrics for open source projects
# Results published to: https://scorecard.dev/viewer/?uri=github.com/Byron/data_ingestor

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesday at 9:21 PM UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload SARIF results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to clone repository
      contents: read
      # Needed to access workflow runs
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit
          # Allow scorecard to make necessary API calls
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            api.scorecard.dev:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for accurate analysis

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results for public repositories
          publish_results: true
          # Optional: Use GitHub PAT for more accurate branch protection checks
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          sarif_file: scorecard-results.sarif

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error
