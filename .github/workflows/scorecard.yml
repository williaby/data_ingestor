# OpenSSF Scorecard Security Assessment
# Automated security health metrics for open source projects
# Results published to: https://scorecard.dev/viewer/?uri=github.com/Byron/data_ingestor

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesday at 9:21 PM UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload SARIF results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to clone repository
      contents: read
      # Needed to access workflow runs
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit
          # Allowed endpoints for OpenSSF Scorecard
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            api.scorecard.dev:443
            uploads.github.com:443
            api.osv.dev:443
            www.bestpractices.dev:443

      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@dc50aa9510b46c811795eb24b2f1ba02a914e534 # v2.3.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to enable badge
          publish_results: true
          # Optional: GitHub PAT for enhanced branch protection checks
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload Scorecard Results to Artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard Results as JSON
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: scorecard-results-json
          path: results.json
          retention-days: 5
        continue-on-error: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b611370bb5703a7efb587f9d136a52ea24c5c38c # v3.25.11
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
