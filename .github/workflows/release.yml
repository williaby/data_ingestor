# Automated Release Workflow using Semantic Release
# Generates version numbers, changelogs, and GitHub releases from conventional commits
# Publishes to PyPI on main branch pushes

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip release if commit message contains [skip ci] or [skip release]
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Cache uv Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: release-uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            release-uv-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Run Tests
        run: |
          uv run --frozen pytest -v \
            --cov=src \
            --cov-report=term-missing \
            -m "not slow and not performance"

      - name: Build Package
        run: |
          uv build
          ls -lh dist/

      - name: Setup Node.js for Semantic Release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Install Semantic Release
        run: |
          npm install -g \
            semantic-release@23 \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Create .releaserc.json
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                "releaseRules": [
                  {"type": "feat", "release": "minor"},
                  {"type": "fix", "release": "patch"},
                  {"type": "perf", "release": "patch"},
                  {"type": "revert", "release": "patch"},
                  {"type": "docs", "release": false},
                  {"type": "style", "release": false},
                  {"type": "refactor", "release": "patch"},
                  {"type": "test", "release": false},
                  {"type": "build", "release": "patch"},
                  {"type": "ci", "release": false},
                  {"type": "chore", "release": false},
                  {"breaking": true, "release": "major"}
                ]
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "conventionalcommits",
                "presetConfig": {
                  "types": [
                    {"type": "feat", "section": "Features"},
                    {"type": "fix", "section": "Bug Fixes"},
                    {"type": "perf", "section": "Performance Improvements"},
                    {"type": "revert", "section": "Reverts"},
                    {"type": "refactor", "section": "Code Refactoring"},
                    {"type": "build", "section": "Build System"},
                    {"type": "docs", "section": "Documentation", "hidden": false},
                    {"type": "style", "section": "Styles", "hidden": true},
                    {"type": "chore", "section": "Miscellaneous", "hidden": true},
                    {"type": "test", "section": "Tests", "hidden": true},
                    {"type": "ci", "section": "CI/CD", "hidden": true}
                  ]
                }
              }],
              ["@semantic-release/changelog", {
                "changelogFile": "CHANGELOG.md",
                "changelogTitle": "# Changelog\n\nAll notable changes to this project will be documented in this file."
              }],
              ["@semantic-release/exec", {
                "prepareCmd": "uv version ${nextRelease.version}"
              }],
              ["@semantic-release/github", {
                "assets": [
                  {"path": "dist/*.tar.gz", "label": "Source Distribution"},
                  {"path": "dist/*.whl", "label": "Python Wheel"}
                ]
              }],
              ["@semantic-release/git", {
                "assets": ["CHANGELOG.md", "pyproject.toml"],
                "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
              }]
            ]
          }
          EOF

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    if: success()
    environment:
      name: pypi
      url: https://pypi.org/project/data-ingestor/
    permissions:
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443

      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
          verbose: true
