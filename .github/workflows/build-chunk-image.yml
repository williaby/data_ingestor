#
# Build, smoke-test, sign, and push the chunk-job image (Dockerfile.chunk) to
# GHCR. Pattern follows the family-office-portal build-image.yml. The image is
# pushed only after the smoke test passes.
name: Build Chunk Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.chunk'
      - 'Dockerfile.chunk.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-chunk-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry (false for a build and smoke test only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-chunk-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/williaby/data-ingestor-chunk

jobs:
  build:
    name: Build chunk image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Compute tags
        id: meta
        env:
          SOURCE_SHA: ${{ github.sha }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          SHA_TAG="sha-${SOURCE_SHA:0:7}"
          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${IS_MAIN}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest,${IMAGE}:$(date +%Y%m%d)"
          fi
          {
            echo "tags=${TAGS}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.chunk
          platforms: linux/amd64
          push: false
          load: true
          tags: data-ingestor-chunk-smoke:ci
          cache-from: type=gha,scope=data-ingestor-chunk
          cache-to: type=gha,mode=max,scope=data-ingestor-chunk

      # The job is a CLI, so the smoke test checks what a broken build would
      # lose: the entrypoint starts, the chunk command imports its whole
      # dependency closure, the image runs as a non-root user, and it runs
      # with a read-only root filesystem. No document or service is needed.
      - name: Smoke test
        run: |
          set -euo pipefail
          IMG=data-ingestor-chunk-smoke:ci
          user="$(docker inspect --format '{{.Config.User}}' "${IMG}")"
          if [ "${user}" != "65532:65532" ]; then
            echo "expected user 65532:65532, got '${user}'"
            exit 1
          fi
          docker run --rm --read-only --tmpfs /tmp "${IMG}" --help
          docker run --rm --read-only --tmpfs /tmp "${IMG}" chunk --help

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.chunk
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=data-ingestor-chunk
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.build.outputs.digest != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.push == true)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Summary
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Chunk image"
            echo "Pin in the homelab-infra data-ingestor job: \`${SHA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
