#
# Build, smoke-test, sign, and push the chunk-job image (chunk.Dockerfile) to
# GHCR. Pattern follows the family-office-portal build-image.yml.
#
# Two jobs: "build" builds and smoke-tests with read-only permissions and runs
# on pull requests too; "push" needs it, runs only on main, and is the only job
# that can write packages or sign. A run from any other ref never pushes.
#
# The push job publishes by digest only: no tag exists until the image has been
# pulled back by digest, passed the same smoke script as the build job, and been
# signed. Only then are the sha, date and latest tags added to that digest.
name: Build Chunk Image

on:
  push:
    branches: [main]
    paths:
      - 'chunk.Dockerfile'
      - 'chunk.Dockerfile.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-chunk-image.yml'
      - '.github/scripts/smoke-chunk-image.sh'
  # A pull request builds and smoke-tests the image but never pushes it.
  pull_request:
    branches: [main]
    paths:
      - 'chunk.Dockerfile'
      - 'chunk.Dockerfile.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-chunk-image.yml'
      - '.github/scripts/smoke-chunk-image.sh'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry (main only; false for a build and smoke test only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-chunk-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/williaby/data-ingestor

jobs:
  build:
    name: Build chunk image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The cache is written here and read by the push job, so the pushed image is
      # assembled from the layers this job built and tested.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: chunk.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: data-ingestor-smoke:ci
          cache-from: type=gha,scope=data-ingestor
          cache-to: type=gha,mode=max,scope=data-ingestor

      # The same script runs again in the push job against the image pulled back
      # by digest.
      - name: Smoke test
        run: bash .github/scripts/smoke-chunk-image.sh data-ingestor-smoke:ci

  push:
    name: Push chunk image
    needs: build
    # Only main publishes. A pull request or a manual run from another branch
    # stops after the build job, so no unsigned tag is ever pushed.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.push == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Rebuilt from the cache the build job wrote (same scope), so the layers are
      # the ones that were smoke-tested. The image is pushed by digest only, with
      # its provenance and SBOM attestations, and carries no tag yet.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: chunk.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=data-ingestor
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # What is signed and tagged below is what the registry now holds, so test
      # that, not the local build.
      - name: Pull by digest and smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          bash .github/scripts/smoke-chunk-image.sh "${IMAGE}@${DIGEST}"

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # imagetools create copies the manifest list, attestations included, so the
      # tags point at exactly the digest that was tested and signed.
      - name: Tag the signed digest
        id: tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${SOURCE_SHA:0:7}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:$(date +%Y%m%d)" \
            "${IMAGE}@${DIGEST}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Chunk image"
            echo "Short tag (a lookup aid): \`${IMAGE}:${SHA_TAG}\`"
            echo "Pin deployments to the digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
