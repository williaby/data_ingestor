# ClusterFuzzLite for Data Ingestor
# Continuous fuzzing for document processing security vulnerabilities

name: ClusterFuzzLite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: Build & Run Fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Fuzzers
        id: build
        # Note: ClusterFuzzLite actions use @v1, cannot pin to SHA (maintained by Google)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          dry-run: false

      - name: Run Fuzzers
        # Note: ClusterFuzzLite actions use @v1, cannot pin to SHA (maintained by Google)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        if: steps.build.outcome == 'success'
        with:
          fuzz-seconds: 600
          language: python
          output-sarif: true
          sanitizer: address

      - name: Upload Crash Artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzing-crashes
          path: out/artifacts
          retention-days: 7

      - name: Upload SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: sarif/cifuzz.sarif
        continue-on-error: true

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "🔍 ClusterFuzzLite Fuzzing Analysis Complete"
          echo "Build Status: ${{ steps.build.outcome }}"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Fuzzers built and executed for 600 seconds"
            echo "📄 Document processing modules tested for edge cases"
            echo "🔐 Security vulnerabilities detection active"
            echo "📊 Fuzzing harnesses: fuzz_pdf_parser, fuzz_document_router, fuzz_chunker"
          else
            echo "⚠️  Fuzzer build failed"
            echo "ℹ️  Check logs above for build errors"
            echo "   1. Ensure Clang and LLVM are installed"
            echo "   2. Verify fuzzing harnesses in /fuzz directory"
            echo "   3. Check Atheris installation succeeded"
          fi
