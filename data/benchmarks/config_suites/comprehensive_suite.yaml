# Comprehensive Parser Configuration Suite
# Phase 1D: Scanning Options Testing & Baseline Framework
#
# This suite tests all major parser configuration variants to establish
# performance baselines and optimize routing decisions for Phase 2.

name: "Comprehensive Parser Configuration Suite"
description: "Test all major parser configuration variants for Phase 1D baseline"
version: 1

# Marker parser configurations
# Tests LLM enhancement and force OCR options
marker_configs:
  - name: "marker_default"
    use_llm: false
    force_ocr: false
    languages: ["en"]

  - name: "marker_with_llm"
    use_llm: true
    force_ocr: false
    languages: ["en"]

  - name: "marker_force_ocr"
    use_llm: false
    force_ocr: true
    languages: ["en"]

  - name: "marker_full"
    use_llm: true
    force_ocr: true
    languages: ["en"]

