# PyMuPDF4LLM parser configurations
# Tests page chunking options
pymupdf4llm_configs:
  - name: "pymupdf4llm_default"
    page_chunks: true

  - name: "pymupdf4llm_no_chunks"
    page_chunks: false

# PyMuPDF parser configurations
# Tests different text extraction modes
pymupdf_configs:
  - name: "pymupdf_text"
    get_text_mode: "text"

  - name: "pymupdf_blocks"
    get_text_mode: "blocks"
