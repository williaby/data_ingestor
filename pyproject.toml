[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Project metadata (PEP 621 standard)
[project]
name = "data_ingestor"
version = "0.1.0"
description = "Custom data ingestion tool for use with RAG agents"
authors = [{name = "Byron", email = "byronawilliams@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["ai", "prompt-engineering", "mcp", "zen", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "gradio>=6.0.0,<7.0.0",
    "fastapi>=0.116.0,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    # Temporarily relaxed to allow marker-pdf compatibility (requires anthropic <0.47.0)
    # Tighten back to >=0.57.0,<0.58.0 when implementing LLM features
    "anthropic>=0.46.0,<1.0.0",
    "openai>=1.12.0,<2.0.0",
    "qdrant-client>=1.14.3,<2.0.0",
    "cryptography>=46.0.7,<47.0.0",
    "pyjwt[crypto]>=2.10.1,<3.0.0",
    "python-gnupg>=0.5.2,<0.6.0",
    "pyyaml>=6.0.2,<7.0.0",
    "toml>=0.10.2,<0.11.0",
    "python-multipart>=0.0.27,<0.0.28",
    "redis[hiredis]>=6.0.0,<7.0.0",
    "prometheus-client>=0.20.0,<0.21.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-magic>=0.4.27,<0.5.0",
    "structlog>=24.0.0,<26.0.0",
    "rich>=14.0.0,<15.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "asyncer>=0.0.5,<1.0.0",
    "mcp>=1.10.1,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "typing-extensions>=4.10.0,<5.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "cachetools>=6.1.0,<7.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "starlette>=0.47.2",
    # Database dependencies for AUTH-1 enhanced authentication and AUTH-2 service token management
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<2.0.0",
    "aiohttp>=3.12.15,<4.0.0",
    "plotly>=6.3.0,<7.0.0",
    "pandas>=2.3.1,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    # Document processing dependencies for RAG ingestion pipeline
    # PDF processing
    "pymupdf>=1.24.0,<2.0.0",
    "pymupdf4llm>=0.0.17,<0.0.18",
    # Image processing for PDF resolution enhancement
    "opencv-python-headless>=4.10.0,<5.0.0",
    "pillow>=10.1.0,<11.0.0",  # Compatible with marker-pdf
    # Note: Advanced PDF processing with marker-pdf available via optional extra
    # Install with: uv sync --extra advanced-pdf
    # Note: docling may require separate installation
    # Install separately: pip install docling
    # DOCX processing
    "python-docx>=1.1.0,<2.0.0",
    "docx2python>=3.1.2,<4.0.0",
    # Web scraping
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=6.0.0,<7.0.0",
    "playwright>=1.48.0,<2.0.0",
    # Video/Audio transcription
    "faster-whisper>=1.0.0,<2.0.0",
    "ffmpeg-python>=0.2.0,<0.3.0",
    # Task queue
    "celery[redis]>=5.4.0,<6.0.0",
    "kombu>=5.4.0,<6.0.0",
    # CLI
    "click>=8.1.7,<9.0.0",
    # Chunking and text processing
    "langchain-text-splitters>=1.0.0,<2.0.0",
    # Language detection
    "langdetect>=1.0.9,<2.0.0",
    # PDF table extraction
    "pdfplumber>=0.11.0,<0.12.0",
]

[project.urls]
homepage = "https://github.com/Byron/data_ingestor"
repository = "https://github.com/Byron/data_ingestor"
documentation = "https://github.com/Byron/data_ingestor/wiki"

[project.scripts]
data-ingestor = "data_ingestor.cli.main:cli"

[project.optional-dependencies]
# Marker for advanced PDF processing (requires GPU for optimal performance)
# torch/torchvision versions are managed by marker-pdf dependencies
# Using 1.9.x (latest stable with LLM features, compatible with relaxed anthropic)
# WARNING: marker-pdf constrains regex to <2025.0.0, which has ReDoS vulnerability (CVE-2025-78558)
# Security vs Feature tradeoff: Choose based on deployment needs
# - For production: Skip this extra and upgrade regex to >=2025.2.10
# - For advanced PDF: Install this extra, accept vulnerability, use input validation
advanced-pdf = [
    "marker-pdf>=1.9.3,<2.0.0",
]

# Development dependency groups (PEP 735)
[dependency-groups]
dev = [
    "pytest>=8.0.1",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.1.3",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=12.0",
    "hypothesis>=6.98.9",
    "faker>=37.0.0",
    "black==24.10.0",
    "ruff==0.12.3",
    "mypy==1.13.0",
    "types-pyyaml>=6.0.12.12",
    "types-python-dateutil>=2.8.19.20240106",
    "types-aiofiles>=24.0.0",
    "bandit[toml]==1.7.7",
    "safety>=3.0.1",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.0",
    "nox>=2025.1.0",
    "ipython>=9.0.0",
    "ipdb>=0.13.13",
    "toml>=0.10.2,<0.11.0",
    "mutmut>=3.3.0,<4.0.0",
    # pact-python>=2.3.2  # Temporarily removed due to CI build issues with external dependency
    "locust>=2.0.0,<3.0.0",
    "pip-audit>=2.9.0,<3.0.0",
    "types-cachetools>=6.1.0.20250717,<7.0.0",
    "isort>=6.0.1,<7.0.0",
    "datasets>=4.4.0,<5.0.0",
]
azure = [
    "azure-identity>=1.15.0,<2.0.0",
    "azure-keyvault-secrets>=4.11.0,<5.0.0",
    "azure-storage-blob>=12.19.0,<13.0.0",
]
ml = [
    "sentence-transformers>=3.0.0,<6.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "numpy>=1.26.1,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "spacy>=3.7.0,<4.0.0",
    "nltk>=3.8.0,<4.0.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.32,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<0.25.0",
]
test = [
    "pytest-benchmark>=4.0.0",
    "pytest-memray>=1.5.0",
    "aiosqlite>=0.21.0,<0.22.0",
]

[tool.uv]
# All non-optional dependency groups are installed by default via uv sync.
# advanced-pdf remains opt-in via the optional extra (uv sync --extra advanced-pdf).
default-groups = ["dev", "test", "azure", "ml", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/data_ingestor"]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = [
    "*.yaml",
    "*.yml",
    "docker-compose*.yaml",
    "docker-compose*.yml",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "ISC", # flake8-implicit-str_concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "ANN401",  # dynamically typed expressions (Any)
    "S101",    # use of assert detected
    "PLR0913", # too many arguments
    "BLE001",  # blind exception catching (needed for generic error handlers)
    # Industry standard additions for development workflow:
    "UP038",   # isinstance syntax (Python compatibility)
    "PLR2004", # magic numbers (for obvious values)
    "ARG002",  # unused arguments (interface compatibility)
    "SIM102",  # nested if statements (readability preference)
    # Pre-existing style debt grandfathered during the Poetry->uv migration.
    # These are non-functional/stylistic findings; track removal in a follow-up.
    "G004",    # f-string in logging call
    "PTH123",  # open() vs Path.open()
    "PTH110",  # os.path.exists vs Path.exists
    "PTH107",  # os.remove vs Path.unlink
    "PTH104",  # os.rename vs Path.rename
    "DTZ005",  # datetime.now() without tz
    "DTZ001",  # datetime() without tzinfo
    "S110",    # try-except-pass (intentional best-effort blocks)
    "S108",    # hardcoded temp path
    "S104",    # bind to all interfaces (configurable)
    "INP001",  # implicit namespace package (some test dirs lack __init__)
    "RUF001",  # ambiguous unicode char in string
    "ERA001",  # commented-out code
    "PT011",   # pytest.raises too broad
    "PT012",   # pytest.raises block too long
    "N802",    # function name not lowercase (acronym helpers)
    "B017",    # assertRaises(Exception)
    "SIM105",  # use contextlib.suppress
    "B007",    # unused loop variable
    "ARG001",  # unused function argument
    "ANN204",  # missing return type on __init__/special method
    "A002",    # argument shadows builtin (e.g. click 'format')
    "B904",    # raise ... from within except
    "PGH003",  # blanket type: ignore
    "ISC001",  # implicit str concat (conflicts with formatter)
    "PLC0415", # import not at top level (lazy/optional imports)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLW2901", # loop variable overwritten in body
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S110", "ANN", "ARG", "PLR2004", "PLC0415", "T201"]  # Allow test patterns and try-except-pass
"tests/auth/*" = ["S101", "S105", "S110", "ANN", "ARG", "PLR2004", "COM812", "UP017", "PLC0415", "RET504", "SIM117", "PT012"]  # Allow test patterns
"tests/performance/*" = ["T201", "S311", "S110", "PLC0415", "F401", "PTH123", "S101", "ANN", "ARG", "PLR2004", "PLR0915"]
"tests/security/test_codeql_validation.py" = ["S105", "S602", "S603", "S608", "S301", "S506", "S324", "S307", "PTH123", "T201", "S101", "ANN", "ARG", "PLR2004"]
"scripts/*" = ["T20", "INP001", "ANN", "PLR0912", "PLR2004", "PTH123", "SIM118", "RUF013", "B007", "PLC0415", "G004", "S607", "S602", "S314", "S603", "RET504", "DTZ005", "RUF100"]
"noxfile.py" = ["ANN", "D"]
"src/config/validation.py" = ["PLC0415"]  # Allow local imports to avoid circular dependencies
"src/config/health.py" = ["UP036", "UP017"]  # Version compatibility for Python 3.11
"src/utils/time_utils.py" = ["UP017"]  # Use timezone.utc for Python 3.11 compatibility
"src/utils/observability.py" = ["UP017"]  # Use timezone.utc for Python 3.11 compatibility
"test_consensus_model_connectivity.py" = ["PLC0415", "T201"]  # Script allows local imports and print
"tests/conftest.py" = ["UP017"]  # Use timezone.utc for Python 3.11 compatibility
"tests/unit/scripts/test_coverage_automation.py" = ["E402"]  # Dynamic imports after sys.path modification
"src/mcp_integration/*" = ["G004"]  # Allow f-strings in logging for structured logging
"src/auth/*" = ["G004", "PLR2004", "SIM110", "RET504"]  # Allow f-strings, magic numbers, and specific patterns
"src/ui/multi_journey_interface.py" = ["PLR0915", "PLR0912"]  # Allow complex UI interface methods
"src/core/*" = ["N805"]  # Allow cls parameter name in Pydantic validators
"src/utils/resilience.py" = ["UP046"]  # Generic class syntax for Python 3.11 compatibility
"src/utils/secure_random.py" = ["UP047"]  # Generic function syntax for Python 3.11 compatibility
"src/data_ingestor/parsers/pdf_parser.py" = ["F401"]  # optional-dependency (marker) import availability probing
"*.yaml" = ["ALL"]
"*.yml" = ["ALL"]

[tool.ruff.lint.pylint]
max-branches = 18      # Increased from default 12 for industry standards
max-statements = 75    # Increased from default 50 for industry standards

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Dedicated isort configuration for import organization
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
known_third_party = ["pytest", "httpx", "fastapi", "gradio", "pydantic", "anthropic", "openai", "qdrant_client"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["**/migrations/*", "**/venv/*", "**/.venv/*"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "examples.*", "noxfile"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.auth.middleware", "src.ui.multi_journey_interface", "src.core.vector_store", "src.config.health"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "sentence_transformers.*",
    "qdrant_client.*",
    "redis.*",
    "yaml.*",
    "gnupg.*",
    "mcp.*",
    "spacy.*",
    "nltk.*",
    "sentry_sdk.*",
    "opentelemetry.*",
    # Runtime deps without type stubs / py.typed
    "fitz",
    "fitz.*",
    "psutil",
    "tqdm",
    "tqdm.*",
    "langdetect",
    "langdetect.*",
    "scipy",
    "scipy.*",
    "marker",
    "marker.*",
]
ignore_missing_imports = true

# Pre-existing type-annotation debt grandfathered during the Poetry->uv
# migration. Core parsing modules (parsers, pipeline.router, chunking, export,
# core) remain fully type-checked; track paying down the modules below.
[[tool.mypy.overrides]]
module = [
    "data_ingestor.benchmarking.baseline",
    "data_ingestor.benchmarking.config_tester",
    "data_ingestor.benchmarking.fingerprint",
    "data_ingestor.benchmarking.orchestrator",
    "data_ingestor.benchmarking.runner",
    "data_ingestor.cli.main",
    "data_ingestor.evaluation.base",
    "data_ingestor.evaluation.doclaynet_evaluator",
    "data_ingestor.evaluation.metrics.layout_metrics",
    "data_ingestor.evaluation.models",
    "data_ingestor.pipeline.pdf_analyzer",
    "data_ingestor.utils.pdf_resolution",
    "data_ingestor.utils.pdf_upscaler",
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --strict-markers --strict-config --asyncio-mode=auto -m 'not slow' --tb=short"
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",  # Suppress Pact Python v2->v3 migration warnings globally
]
markers = [
    # Primary execution control markers
    "slow: genuinely slow tests (excluded from CI/CD and local development)",
    "fast: development cycle tests (for IDE integration)",

    # Test pyramid layer taxonomy (for analysis and metrics)
    "unit: unit-level tests (pure functions/classes; no I/O, no network) - DEFAULT",
    "component: component-level tests (single bounded context incl. DB/container mocks)",
    "contract: consumer-driven contract tests (Pact consumer/provider verifications)",
    "integration: cross-service integration tests (multi-service / real DB / message bus)",
    "e2e: user-facing end-to-end tests (full user journey via HTTP/UI driver)",

    # Non-functional test types (for analysis and selective execution)
    "perf: performance/load tests (benchmarks, stress, timing assertions)",
    "chaos: fault-injection/resilience tests (chaos engineering, fault tolerance)",
    "security: runtime security assertions (Bandit assertions, penetration tests)",

    # Legacy compatibility markers
    "performance: legacy performance marker (mapped to 'perf' in analysis)",
    "stress: legacy stress marker (mapped to 'perf' in analysis)",

    # Execution behavior markers
    "smoke: basic functionality validation tests",
    "no_parallel: tests that should not run in parallel",

    # Component-specific markers
    "auth: authentication and authorization tests",

    # Dependency-specific markers
    "requires_marker: tests requiring Marker parser (GPU-accelerated, high-quality parsing)",
    "requires_doclaynet: tests requiring DocLayNet benchmark dataset",
]

# Note: Test execution profiles are implemented via Makefile and noxfile.py
# See CLAUDE.md for available test commands and execution strategies

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
# Coverage threshold: temporarily lowered from 80 to 70 as a migration baseline.
# The integration tests that lift coverage need data/test_pdfs fixtures that are
# not committed to the repo; restore to 80 once those fixtures are available.
# Configurable via environment: set COVERAGE_FAIL_UNDER=0 for focused testing.
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*_test.py"]
